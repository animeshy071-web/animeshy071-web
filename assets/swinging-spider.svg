<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="850">
  <defs>
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bodyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="threadGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    /* ---- Pendulum swing ---- */
    @keyframes swing {
      0%   { transform: rotate(-32deg); }
      50%  { transform: rotate(32deg);  }
      100% { transform: rotate(-32deg); }
    }
    .pendulum {
      transform-origin: 425px 4px;
      animation: swing 2.6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    }

    /* ---- Arm reaching UP (web-shoot arm follows opposite of swing) ---- */
    @keyframes armPose {
      0%   { transform: rotate(0deg); }
      50%  { transform: rotate(10deg); }
      100% { transform: rotate(0deg); }
    }

    /* ---- Eye lens shimmer ---- */
    @keyframes eyeShimmer {
      0%, 100% { opacity: 1; }
      45%       { opacity: 0.6; }
      55%       { opacity: 1; }
    }
    .lens { animation: eyeShimmer 2.6s ease-in-out infinite; }

    /* ---- Red highlight pulse on chest symbol ---- */
    @keyframes chestPulse {
      0%, 100% { opacity: 0.9; }
      50%       { opacity: 0.4; }
    }
    .chest-symbol { animation: chestPulse 2.6s ease-in-out infinite; }

    /* ---- Label blink ---- */
    @keyframes labelBlink {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }
    .label { animation: labelBlink 3.5s ease-in-out infinite; }
  </style>

  <!-- Dark background strip -->
  <rect width="850" height="210" fill="#050505"/>

  <!-- Faint side web strands (atmosphere) -->
  <line x1="0" y1="0" x2="200" y2="80"  stroke="#8888aa" stroke-width="0.4" opacity="0.12"/>
  <line x1="0" y1="0" x2="280" y2="100" stroke="#8888aa" stroke-width="0.4" opacity="0.08"/>
  <line x1="850" y1="0" x2="650" y2="80"  stroke="#8888aa" stroke-width="0.4" opacity="0.12"/>
  <line x1="850" y1="0" x2="580" y2="100" stroke="#8888aa" stroke-width="0.4" opacity="0.08"/>

  <!-- Anchor dot at top center -->
  <circle cx="425" cy="4" r="2.5" fill="#E50914" opacity="0.9"/>
  <path d="M 415 4 L 425 4 L 435 4" fill="none" stroke="#E50914" stroke-width="1.2" opacity="0.5"/>

  <!-- ============================================================ -->
  <!-- PENDULUM GROUP: thread + pixel-art figure, pivots at 425,4   -->
  <!-- ============================================================ -->
  <g class="pendulum">

    <!-- Silk web thread from anchor down to hand -->
    <line x1="425" y1="4" x2="425" y2="68"
          stroke="#D0D0E0" stroke-width="0.9" opacity="0.8" filter="url(#threadGlow)"/>

    <!-- =========================================================== -->
    <!-- PIXEL ART FIGURE                                             -->
    <!-- Each "pixel" = 5x5 SVG units                                -->
    <!-- Character origin: (425,68) = hand/wrist connecting to thread -->
    <!-- Grid: col offset from center, row from top of head           -->
    <!-- =========================================================== -->
    <g transform="translate(425, 68)" filter="url(#bodyGlow)">

      <!-- === WEB-SHOOTING ARM (reaches UP-LEFT to thread) === -->
      <!-- Upper arm: row -3 to 0, left of center -->
      <rect x="-22" y="-26" width="5"  height="5"  fill="#1a1a22"/><!-- shoulder -->
      <rect x="-17" y="-21" width="5"  height="5"  fill="#1a1a22"/>
      <rect x="-12" y="-16" width="5"  height="5"  fill="#1a1a22"/>
      <rect x="-7"  y="-11" width="5"  height="5"  fill="#1a1a22"/>
      <!-- Wrist / hand (red glove detail) -->
      <rect x="-5"  y="-6"  width="10" height="5"  fill="#CC0010"/>
      <rect x="-3"  y="-1"  width="6"  height="5"  fill="#CC0010"/>

      <!-- === HEAD (rows 0..5 from head-top, centered) === -->
      <!-- head-top at y=0 locally (but head is below the arm, at y=4) -->
      <!-- Row 0: top of helmet -->
      <rect x="-10" y="4"  width="5" height="5" fill="#1a1a22"/>
      <rect x="-5"  y="4"  width="5" height="5" fill="#1a1a22"/>
      <rect x="0"   y="4"  width="5" height="5" fill="#1a1a22"/>
      <rect x="5"   y="4"  width="5" height="5" fill="#1a1a22"/>
      <!-- Row 1 -->
      <rect x="-15" y="9"  width="5" height="5" fill="#1a1a22"/>
      <rect x="-10" y="9"  width="5" height="5" fill="#1a1a22"/>
      <rect x="-5"  y="9"  width="5" height="5" fill="#1a1a22"/>
      <rect x="0"   y="9"  width="5" height="5" fill="#1a1a22"/>
      <rect x="5"   y="9"  width="5" height="5" fill="#1a1a22"/>
      <rect x="10"  y="9"  width="5" height="5" fill="#1a1a22"/>
      <!-- Row 2: eye row left -->
      <rect x="-15" y="14" width="5" height="5" fill="#1a1a22"/>
      <!-- Left eye lens (large white) -->
      <rect class="lens" x="-12" y="14" width="9" height="8" rx="2" fill="#F0F0FF" filter="url(#eyeGlow)"/>
      <!-- between eyes -->
      <rect x="-3"  y="14" width="5" height="5" fill="#1a1a22"/>
      <!-- Right eye lens (large white) -->
      <rect class="lens" x="2"  y="14" width="9" height="8" rx="2" fill="#F0F0FF" filter="url(#eyeGlow)"/>
      <!-- right edge -->
      <rect x="11"  y="14" width="5" height="5" fill="#1a1a22"/>
      <!-- Row 3: lower eye row -->
      <rect x="-15" y="19" width="5" height="5" fill="#1a1a22"/>
      <rect x="-10" y="19" width="5" height="5" fill="#1a1a22"/>
      <rect x="-5"  y="19" width="5" height="5" fill="#1a1a22"/>
      <rect x="0"   y="19" width="5" height="5" fill="#1a1a22"/>
      <rect x="5"   y="19" width="5" height="5" fill="#1a1a22"/>
      <rect x="10"  y="19" width="5" height="5" fill="#1a1a22"/>
      <!-- Row 4 -->
      <rect x="-10" y="24" width="5" height="5" fill="#1a1a22"/>
      <rect x="-5"  y="24" width="5" height="5" fill="#1a1a22"/>
      <rect x="0"   y="24" width="5" height="5" fill="#1a1a22"/>
      <rect x="5"   y="24" width="5" height="5" fill="#1a1a22"/>

      <!-- === NECK === -->
      <rect x="-5"  y="29" width="5" height="5" fill="#1a1a22"/>
      <rect x="0"   y="29" width="5" height="5" fill="#1a1a22"/>

      <!-- === TORSO (rows 7-13 from origin) === -->
      <!-- Shoulders row 7 -->
      <rect x="-20" y="34" width="5" height="5" fill="#1a1a22"/>
      <rect x="-15" y="34" width="5" height="5" fill="#CC0010"/><!-- red shoulder -->
      <rect x="-10" y="34" width="5" height="5" fill="#CC0010"/>
      <rect x="-5"  y="34" width="5" height="5" fill="#1a1a22"/>
      <rect x="0"   y="34" width="5" height="5" fill="#1a1a22"/>
      <rect x="5"   y="34" width="5" height="5" fill="#CC0010"/>
      <rect x="10"  y="34" width="5" height="5" fill="#CC0010"/><!-- red shoulder -->
      <rect x="15"  y="34" width="5" height="5" fill="#1a1a22"/>

      <!-- Chest row 8 -->
      <rect x="-20" y="39" width="5" height="5" fill="#1a1a22"/>
      <rect x="-15" y="39" width="5" height="5" fill="#1a1a22"/>
      <rect x="-10" y="39" width="5" height="5" fill="#CC0010"/>
      <rect x="-5"  y="39" width="5" height="5" fill="#CC0010"/><!-- chest symbol -->
      <rect x="0"   y="39" width="5" height="5" fill="#CC0010"/>
      <rect x="5"   y="39" width="5" height="5" fill="#CC0010"/>
      <rect x="10"  y="39" width="5" height="5" fill="#1a1a22"/>
      <rect x="15"  y="39" width="5" height="5" fill="#1a1a22"/>

      <!-- Chest row 9 (web/logo mark) -->
      <rect x="-20" y="44" width="5" height="5" fill="#0d0d12"/>
      <rect x="-15" y="44" width="5" height="5" fill="#0d0d12"/>
      <rect class="chest-symbol" x="-10" y="44" width="5" height="5" fill="#E50914"/><!-- logo arm left -->
      <rect x="-5"  y="44" width="5" height="5" fill="#1a1a22"/>
      <rect x="0"   y="44" width="5" height="5" fill="#1a1a22"/>
      <rect class="chest-symbol" x="5"  y="44" width="5" height="5" fill="#E50914"/><!-- logo arm right -->
      <rect x="10"  y="44" width="5" height="5" fill="#0d0d12"/>
      <rect x="15"  y="44" width="5" height="5" fill="#0d0d12"/>

      <!-- Mid torso row 10 -->
      <rect x="-15" y="49" width="5" height="5" fill="#1a1a22"/>
      <rect x="-10" y="49" width="5" height="5" fill="#1a1a22"/>
      <rect x="-5"  y="49" width="5" height="5" fill="#1a1a22"/>
      <rect x="0"   y="49" width="5" height="5" fill="#1a1a22"/>
      <rect x="5"   y="49" width="5" height="5" fill="#1a1a22"/>
      <rect x="10"  y="49" width="5" height="5" fill="#1a1a22"/>

      <!-- Waist row 11 -->
      <rect x="-10" y="54" width="5" height="5" fill="#1a1a22"/>
      <rect x="-5"  y="54" width="5" height="5" fill="#0d0d12"/>
      <rect x="0"   y="54" width="5" height="5" fill="#0d0d12"/>
      <rect x="5"   y="54" width="5" height="5" fill="#1a1a22"/>

      <!-- === FREE ARM (swings/tucks on the right side) === -->
      <rect x="20"  y="39" width="5" height="5" fill="#1a1a22"/><!-- upper arm -->
      <rect x="25"  y="44" width="5" height="5" fill="#1a1a22"/>
      <rect x="25"  y="49" width="5" height="5" fill="#CC0010"/><!-- forearm red -->
      <rect x="20"  y="54" width="5" height="5" fill="#CC0010"/><!-- fist red -->

      <!-- === LEGS (swept back in swing pose) === -->
      <!-- Upper left thigh (back) -->
      <rect x="-15" y="59" width="5" height="5" fill="#1a1a22"/>
      <rect x="-10" y="59" width="5" height="5" fill="#CC0010"/><!-- upper thigh red stripe -->
      <rect x="-5"  y="59" width="5" height="5" fill="#1a1a22"/>
      <!-- Upper right thigh -->
      <rect x="0"   y="59" width="5" height="5" fill="#1a1a22"/>
      <rect x="5"   y="59" width="5" height="5" fill="#CC0010"/><!-- upper thigh red stripe -->
      <rect x="10"  y="59" width="5" height="5" fill="#1a1a22"/>

      <!-- Left lower leg (swept back) -->
      <rect x="-20" y="64" width="5" height="5" fill="#1a1a22"/>
      <rect x="-15" y="64" width="5" height="5" fill="#1a1a22"/>
      <rect x="-20" y="69" width="5" height="5" fill="#1a1a22"/>
      <rect x="-15" y="69" width="5" height="5" fill="#CC0010"/><!-- calf red -->
      <rect x="-25" y="74" width="5" height="5" fill="#1a1a22"/><!-- boot -->
      <rect x="-20" y="74" width="5" height="5" fill="#1a1a22"/><!-- boot -->
      <rect x="-15" y="74" width="5" height="5" fill="#CC0010"/><!-- boot red -->

      <!-- Right lower leg (swept back / bent) -->
      <rect x="10"  y="64" width="5" height="5" fill="#1a1a22"/>
      <rect x="15"  y="64" width="5" height="5" fill="#1a1a22"/>
      <rect x="15"  y="69" width="5" height="5" fill="#1a1a22"/>
      <rect x="20"  y="69" width="5" height="5" fill="#CC0010"/><!-- calf red -->
      <rect x="15"  y="74" width="5" height="5" fill="#1a1a22"/><!-- boot -->
      <rect x="20"  y="74" width="5" height="5" fill="#CC0010"/><!-- boot red -->
      <rect x="25"  y="74" width="5" height="5" fill="#1a1a22"/><!-- boot -->

    </g>
    <!-- END PIXEL FIGURE -->

  </g>
  <!-- END PENDULUM GROUP -->

  <!-- ============================================== -->
  <!-- LABEL BELOW                                    -->
  <!-- ============================================== -->
  <text class="label" x="425" y="200" text-anchor="middle"
        font-family="'Consolas','Fira Code',monospace"
        font-size="10.5" fill="#68687a" letter-spacing="2.5">
    LIVE CONTRIBUTION FEED // github.com/animeshy071-web
  </text>

</svg>
