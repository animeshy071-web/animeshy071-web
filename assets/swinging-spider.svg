<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="850">
  <defs>
    <filter id="eyeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="figureGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="threadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    /* Pendulum swing — pivots around top-center anchor */
    @keyframes swing {
      0%   { transform: rotate(-35deg); }
      50%  { transform: rotate(35deg);  }
      100% { transform: rotate(-35deg); }
    }
    .pendulum {
      transform-origin: 425px 5px;
      animation: swing 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    }

    /* Eye shimmer */
    @keyframes eyeShimmer {
      0%, 100% { opacity: 1; }
      40%       { opacity: 0.5; }
      60%       { opacity: 1; }
    }
    .lens { animation: eyeShimmer 2.8s ease-in-out infinite; }

    /* Chest web emblem pulse */
    @keyframes emblemPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
    .emblem { animation: emblemPulse 2.8s ease-in-out infinite; }

    /* Label fade */
    @keyframes labelFade {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }
    .label { animation: labelFade 3.5s ease-in-out infinite; }
  </style>

  <!-- Dark background -->
  <rect width="850" height="240" fill="#050505"/>

  <!-- Faint atmosphere web strands -->
  <line x1="0"   y1="0"   x2="240" y2="90"  stroke="#9090b0" stroke-width="0.5" opacity="0.1"/>
  <line x1="0"   y1="0"   x2="170" y2="110" stroke="#9090b0" stroke-width="0.4" opacity="0.07"/>
  <line x1="850" y1="0"   x2="610" y2="90"  stroke="#9090b0" stroke-width="0.5" opacity="0.1"/>
  <line x1="850" y1="0"   x2="680" y2="110" stroke="#9090b0" stroke-width="0.4" opacity="0.07"/>

  <!-- Anchor point -->
  <circle cx="425" cy="5" r="3" fill="#E50914" opacity="0.9"/>
  <rect x="408" y="4" width="34" height="2" rx="1" fill="#E50914" opacity="0.4"/>

  <!-- ================================================================ -->
  <!-- PENDULUM GROUP — pivots at 425,5                                  -->
  <!-- ================================================================ -->
  <g class="pendulum">

    <!-- Silk thread: from anchor down to the wrist area of the figure -->
    <line x1="425" y1="5" x2="425" y2="72"
          stroke="#C8C8D8" stroke-width="1.1" opacity="0.85" filter="url(#threadGlow)"/>

    <!-- ================================================================ -->
    <!-- PIXEL-ART SCARLET SPIDER FIGURE                                   -->
    <!-- Pixel size: 7x7 SVG units. Figure origin at (425, 72).           -->
    <!-- Character is drawn in swinging pose: one arm up reaching the web  -->
    <!-- ================================================================ -->
    <g transform="translate(425,72)" filter="url(#figureGlow)">

      <!-- === REACHING ARM (left side, going UP to web) === -->
      <!-- Upper arm angled up-left -->
      <rect x="-42" y="-38" width="7" height="7" fill="#CC0010"/><!-- red glove cuff -->
      <rect x="-35" y="-31" width="7" height="7" fill="#CC0010"/>
      <rect x="-28" y="-24" width="7" height="7" fill="#1c1c26"/><!-- forearm -->
      <rect x="-21" y="-17" width="7" height="7" fill="#1c1c26"/>
      <rect x="-14" y="-10" width="7" height="7" fill="#1c1c26"/><!-- shoulder joint -->

      <!-- === HEAD (centered, rows top-to-bottom) === -->
      <!-- Row 0: top of mask -->
      <rect x="-14" y="0"  width="7" height="7" fill="#1c1c26"/>
      <rect x="-7"  y="0"  width="7" height="7" fill="#1c1c26"/>
      <rect x="0"   y="0"  width="7" height="7" fill="#1c1c26"/>
      <rect x="7"   y="0"  width="7" height="7" fill="#1c1c26"/>
      <!-- Row 1 -->
      <rect x="-21" y="7"  width="7" height="7" fill="#1c1c26"/>
      <rect x="-14" y="7"  width="7" height="7" fill="#1c1c26"/>
      <rect x="-7"  y="7"  width="7" height="7" fill="#1c1c26"/>
      <rect x="0"   y="7"  width="7" height="7" fill="#1c1c26"/>
      <rect x="7"   y="7"  width="7" height="7" fill="#1c1c26"/>
      <rect x="14"  y="7"  width="7" height="7" fill="#1c1c26"/>
      <!-- Row 2: EYE ROW — large white angular lenses -->
      <rect x="-21" y="14" width="7" height="7" fill="#1c1c26"/>
      <!-- Left eye lens -->
      <rect class="lens" x="-18" y="14" width="13" height="10" rx="3" fill="#EEEEFF" filter="url(#eyeGlow)"/>
      <!-- Bridge -->
      <rect x="-5"  y="14" width="3"  height="7" fill="#1c1c26"/>
      <!-- Right eye lens -->
      <rect class="lens" x="2"  y="14" width="13" height="10" rx="3" fill="#EEEEFF" filter="url(#eyeGlow)"/>
      <rect x="15"  y="14" width="6"  height="7" fill="#1c1c26"/>
      <!-- Row 3: below eyes -->
      <rect x="-21" y="21" width="7" height="7" fill="#1c1c26"/>
      <rect x="-14" y="21" width="7" height="7" fill="#1c1c26"/>
      <rect x="-7"  y="21" width="7" height="7" fill="#1c1c26"/>
      <rect x="0"   y="21" width="7" height="7" fill="#1c1c26"/>
      <rect x="7"   y="21" width="7" height="7" fill="#1c1c26"/>
      <rect x="14"  y="21" width="7" height="7" fill="#1c1c26"/>
      <!-- Row 4: chin -->
      <rect x="-14" y="28" width="7" height="7" fill="#1c1c26"/>
      <rect x="-7"  y="28" width="7" height="7" fill="#1c1c26"/>
      <rect x="0"   y="28" width="7" height="7" fill="#1c1c26"/>
      <rect x="7"   y="28" width="7" height="7" fill="#1c1c26"/>

      <!-- === NECK === -->
      <rect x="-7"  y="35" width="7" height="7" fill="#1c1c26"/>
      <rect x="0"   y="35" width="7" height="7" fill="#1c1c26"/>

      <!-- === TORSO === -->
      <!-- Shoulders Row -->
      <rect x="-28" y="42" width="7" height="7" fill="#1c1c26"/>
      <rect x="-21" y="42" width="7" height="7" fill="#CC0010"/><!-- left shoulder red -->
      <rect x="-14" y="42" width="7" height="7" fill="#CC0010"/>
      <rect x="-7"  y="42" width="7" height="7" fill="#1c1c26"/>
      <rect x="0"   y="42" width="7" height="7" fill="#1c1c26"/>
      <rect x="7"   y="42" width="7" height="7" fill="#CC0010"/><!-- right shoulder red -->
      <rect x="14"  y="42" width="7" height="7" fill="#CC0010"/>
      <rect x="21"  y="42" width="7" height="7" fill="#1c1c26"/>
      <!-- Chest Row 1 -->
      <rect x="-28" y="49" width="7" height="7" fill="#1c1c26"/>
      <rect x="-21" y="49" width="7" height="7" fill="#1c1c26"/>
      <rect x="-14" y="49" width="7" height="7" fill="#CC0010"/>
      <rect x="-7"  y="49" width="7" height="7" fill="#CC0010"/><!-- chest center -->
      <rect x="0"   y="49" width="7" height="7" fill="#CC0010"/>
      <rect x="7"   y="49" width="7" height="7" fill="#CC0010"/>
      <rect x="14"  y="49" width="7" height="7" fill="#1c1c26"/>
      <rect x="21"  y="49" width="7" height="7" fill="#1c1c26"/>
      <!-- Web emblem / chest mark row 2 -->
      <rect x="-28" y="56" width="7" height="7" fill="#111118"/>
      <rect x="-21" y="56" width="7" height="7" fill="#111118"/>
      <rect class="emblem" x="-14" y="56" width="7" height="7" fill="#E50914"/><!-- web arm left -->
      <rect x="-7"  y="56" width="7" height="7" fill="#1c1c26"/>
      <rect x="0"   y="56" width="7" height="7" fill="#1c1c26"/>
      <rect class="emblem" x="7"  y="56" width="7" height="7" fill="#E50914"/><!-- web arm right -->
      <rect x="14"  y="56" width="7" height="7" fill="#111118"/>
      <rect x="21"  y="56" width="7" height="7" fill="#111118"/>
      <!-- Mid torso -->
      <rect x="-21" y="63" width="7" height="7" fill="#1c1c26"/>
      <rect x="-14" y="63" width="7" height="7" fill="#1c1c26"/>
      <rect x="-7"  y="63" width="7" height="7" fill="#1c1c26"/>
      <rect x="0"   y="63" width="7" height="7" fill="#1c1c26"/>
      <rect x="7"   y="63" width="7" height="7" fill="#1c1c26"/>
      <rect x="14"  y="63" width="7" height="7" fill="#1c1c26"/>
      <!-- Waist -->
      <rect x="-14" y="70" width="7" height="7" fill="#1c1c26"/>
      <rect x="-7"  y="70" width="7" height="7" fill="#111118"/>
      <rect x="0"   y="70" width="7" height="7" fill="#111118"/>
      <rect x="7"   y="70" width="7" height="7" fill="#1c1c26"/>

      <!-- === FREE ARM (right side, swings out) === -->
      <rect x="28"  y="49" width="7" height="7" fill="#1c1c26"/><!-- upper arm -->
      <rect x="35"  y="56" width="7" height="7" fill="#1c1c26"/>
      <rect x="35"  y="63" width="7" height="7" fill="#CC0010"/><!-- forearm red -->
      <rect x="28"  y="70" width="7" height="7" fill="#CC0010"/><!-- fist -->
      <rect x="21"  y="70" width="7" height="7" fill="#CC0010"/><!-- fist -->

      <!-- === LEGS (swept back in swing pose) === -->
      <!-- Upper thighs -->
      <rect x="-21" y="77" width="7" height="7" fill="#1c1c26"/>
      <rect x="-14" y="77" width="7" height="7" fill="#CC0010"/><!-- left thigh stripe -->
      <rect x="-7"  y="77" width="7" height="7" fill="#1c1c26"/>
      <rect x="0"   y="77" width="7" height="7" fill="#1c1c26"/>
      <rect x="7"   y="77" width="7" height="7" fill="#CC0010"/><!-- right thigh stripe -->
      <rect x="14"  y="77" width="7" height="7" fill="#1c1c26"/>
      <!-- Left lower leg / calf (sweeping back-left) -->
      <rect x="-28" y="84" width="7" height="7" fill="#1c1c26"/>
      <rect x="-21" y="84" width="7" height="7" fill="#1c1c26"/>
      <rect x="-28" y="91" width="7" height="7" fill="#1c1c26"/>
      <rect x="-21" y="91" width="7" height="7" fill="#CC0010"/><!-- calf red -->
      <!-- Left boot -->
      <rect x="-35" y="98" width="7" height="7" fill="#1c1c26"/>
      <rect x="-28" y="98" width="7" height="7" fill="#1c1c26"/>
      <rect x="-21" y="98" width="7" height="7" fill="#CC0010"/><!-- boot red -->
      <!-- Right lower leg / calf (sweeping back-right) -->
      <rect x="14"  y="84" width="7" height="7" fill="#1c1c26"/>
      <rect x="21"  y="84" width="7" height="7" fill="#1c1c26"/>
      <rect x="21"  y="91" width="7" height="7" fill="#1c1c26"/>
      <rect x="28"  y="91" width="7" height="7" fill="#CC0010"/><!-- calf red -->
      <!-- Right boot -->
      <rect x="21"  y="98" width="7" height="7" fill="#1c1c26"/>
      <rect x="28"  y="98" width="7" height="7" fill="#CC0010"/><!-- boot red -->
      <rect x="35"  y="98" width="7" height="7" fill="#1c1c26"/>

    </g>
    <!-- END PIXEL FIGURE -->

  </g>
  <!-- END PENDULUM GROUP -->

  <!-- Label -->
  <text class="label" x="425" y="228" text-anchor="middle"
        font-family="'Consolas','Fira Code',monospace"
        font-size="10.5" fill="#68687a" letter-spacing="2.5">
    LIVE CONTRIBUTION FEED // github.com/animeshy071-web
  </text>

</svg>
