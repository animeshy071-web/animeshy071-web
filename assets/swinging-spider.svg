<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="850">
  <defs>
    <!-- Silk strand filter: soft blur for glow on thread -->
    <filter id="silkGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Crimson spider body glow -->
    <filter id="spiderGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Shadow under spider -->
    <filter id="spiderShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#E50914" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    /* Background strip */
    .strip-bg { fill: #050505; }

    /* === Pendulum swing === */
    /*
      The spider swings back and forth on a silk thread from anchor at (425, 0).
      We animate a transform-origin at the anchor using rotate around that point.
    */
    @keyframes pendulumSwing {
      0%   { transform: rotate(-38deg); }
      50%  { transform: rotate(38deg); }
      100% { transform: rotate(-38deg); }
    }

    .swing-group {
      transform-origin: 425px 0px;
      animation: pendulumSwing 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    }

    /* Spider leg wiggle during swing */
    @keyframes legWiggleL {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(14deg); }
      75%       { transform: rotate(-8deg); }
    }
    @keyframes legWiggleR {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(-14deg); }
      75%       { transform: rotate(8deg); }
    }

    .spider-legs-left  { transform-origin: 425px 92px; animation: legWiggleL 2.8s cubic-bezier(0.37,0,0.63,1) infinite; }
    .spider-legs-right { transform-origin: 425px 92px; animation: legWiggleR 2.8s cubic-bezier(0.37,0,0.63,1) infinite; }

    /* Pulsing crimson eyes */
    @keyframes eyePulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .spider-eye { animation: eyePulse 1.4s ease-in-out infinite; }

    /* Label fade annotation */
    @keyframes labelFade {
      0%, 100% { opacity: 0.55; }
      50%       { opacity: 1; }
    }
    .label-text { animation: labelFade 3.5s ease-in-out infinite; }
  </style>

  <!-- Background strip -->
  <rect class="strip-bg" width="850" height="140"/>

  <!-- Decorative top anchor bracket (comic style) -->
  <path d="M 410 2 L 425 2 L 440 2" fill="none" stroke="#E50914" stroke-width="1.5" opacity="0.6"/>
  <circle cx="425" cy="2" r="2.5" fill="#E50914" opacity="0.8"/>

  <!-- ============================================== -->
  <!-- SWINGING GROUP: thread + spider pivots at 425,2 -->
  <!-- ============================================== -->
  <g class="swing-group">
    <!-- Silk strand from anchor to spider body -->
    <line x1="425" y1="2" x2="425" y2="80"
          stroke="#C0C0D0" stroke-width="0.8" opacity="0.75" filter="url(#silkGlow)"/>

    <!-- === SPIDER BODY === -->
    <g filter="url(#spiderShadow)">

      <!-- LEFT LEGS (behind body layer) -->
      <g class="spider-legs-left">
        <!-- Rear left -->
        <line x1="419" y1="94" x2="402" y2="109" stroke="#CC0010" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="402" y1="109" x2="392" y2="118" stroke="#CC0010" stroke-width="1" stroke-linecap="round"/>
        <!-- Mid left -->
        <line x1="418" y1="90" x2="400" y2="100" stroke="#CC0010" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="400" y1="100" x2="389" y2="106" stroke="#CC0010" stroke-width="1" stroke-linecap="round"/>
        <!-- Front-mid left -->
        <line x1="419" y1="86" x2="403" y2="92" stroke="#CC0010" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="403" y1="92" x2="393" y2="95" stroke="#CC0010" stroke-width="1" stroke-linecap="round"/>
        <!-- Front left -->
        <line x1="421" y1="83" x2="408" y2="84" stroke="#CC0010" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="408" y1="84" x2="399" y2="81" stroke="#CC0010" stroke-width="1" stroke-linecap="round"/>
      </g>

      <!-- RIGHT LEGS (behind body layer) -->
      <g class="spider-legs-right">
        <!-- Rear right -->
        <line x1="431" y1="94" x2="448" y2="109" stroke="#CC0010" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="448" y1="109" x2="458" y2="118" stroke="#CC0010" stroke-width="1" stroke-linecap="round"/>
        <!-- Mid right -->
        <line x1="432" y1="90" x2="450" y2="100" stroke="#CC0010" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="450" y1="100" x2="461" y2="106" stroke="#CC0010" stroke-width="1" stroke-linecap="round"/>
        <!-- Front-mid right -->
        <line x1="431" y1="86" x2="447" y2="92" stroke="#CC0010" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="447" y1="92" x2="457" y2="95" stroke="#CC0010" stroke-width="1" stroke-linecap="round"/>
        <!-- Front right -->
        <line x1="429" y1="83" x2="442" y2="84" stroke="#CC0010" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="442" y1="84" x2="451" y2="81" stroke="#CC0010" stroke-width="1" stroke-linecap="round"/>
      </g>

      <!-- Abdomen (bigger, rear oval) -->
      <ellipse cx="425" cy="98" rx="8.5" ry="11" fill="#B00010"/>
      <!-- Abdomen hourglass mark -->
      <path d="M 422 94 Q 425 97 428 94 Q 425 101 422 104 Q 425 101 428 104"
            fill="none" stroke="#FF4040" stroke-width="0.9" opacity="0.7"/>

      <!-- Cephalothorax (front oval) -->
      <ellipse cx="425" cy="84" rx="7.5" ry="8" fill="#CC0010"/>

      <!-- Eyes -->
      <circle class="spider-eye" cx="422" cy="81" r="1.8" fill="#FF3030"/>
      <circle class="spider-eye" cx="428" cy="81" r="1.8" fill="#FF3030"/>
      <circle cx="422" cy="81" r="0.7" fill="#fff" opacity="0.8"/>
      <circle cx="428" cy="81" r="0.7" fill="#fff" opacity="0.8"/>

    </g>
  </g>

  <!-- ============================================== -->
  <!-- SIDE SILK STRANDS (static, comic atmosphere)   -->
  <!-- ============================================== -->
  <line x1="0" y1="0" x2="120" y2="45" stroke="#888" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="0" x2="180" y2="60" stroke="#888" stroke-width="0.5" opacity="0.10"/>
  <line x1="850" y1="0" x2="730" y2="45" stroke="#888" stroke-width="0.5" opacity="0.15"/>
  <line x1="850" y1="0" x2="680" y2="60" stroke="#888" stroke-width="0.5" opacity="0.10"/>

  <!-- ============================================== -->
  <!-- LABEL: annotation above the live chart         -->
  <!-- ============================================== -->
  <text class="label-text" x="425" y="132" text-anchor="middle"
        font-family="'Consolas','Fira Code',monospace" font-size="10"
        fill="#68687a" letter-spacing="2">
    LIVE CONTRIBUTION FEED // github.com/animeshy071-web
  </text>
</svg>
