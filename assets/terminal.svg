<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 185" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080c" />
      <stop offset="60%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>

    <pattern id="termHalftoneDots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#ffffff" fill-opacity="0.02" />
    </pattern>

    <pattern id="termHatch" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#1c1c28" stroke-width="0.6" opacity="0.4" />
    </pattern>

    <filter id="cursorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes termCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes tLine1 {
      0%, 4% { opacity: 0; }
      5%, 100% { opacity: 1; }
    }
    @keyframes tLine2 {
      0%, 14% { opacity: 0; }
      15%, 100% { opacity: 1; }
    }
    @keyframes tLine3 {
      0%, 28% { opacity: 0; }
      30%, 100% { opacity: 1; }
    }
    @keyframes tLine4 {
      0%, 42% { opacity: 0; }
      45%, 100% { opacity: 1; }
    }
    @keyframes tLine5 {
      0%, 58% { opacity: 0; }
      60%, 100% { opacity: 1; }
    }
    @keyframes tLine6 {
      0%, 72% { opacity: 0; }
      75%, 100% { opacity: 1; }
    }

    @keyframes pulseCrimsonPip {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .comic-cursor {
      animation: termCursor 0.85s infinite;
      fill: #FF3030;
    }

    .t-l1 { animation: tLine1 14s infinite; }
    .t-l2 { animation: tLine2 14s infinite; }
    .t-l3 { animation: tLine3 14s infinite; }
    .t-l4 { animation: tLine4 14s infinite; }
    .t-l5 { animation: tLine5 14s infinite; }
    .t-l6 { animation: tLine6 14s infinite; }
    .live-pip { animation: pulseCrimsonPip 2s infinite ease-in-out; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="850" height="185" fill="#050505" />

  <!-- Comic Shadow Underlayer (+2, +3) -->
  <rect x="7" y="7" width="836" height="171" fill="#10182A" opacity="0.6" />

  <!-- Main Terminal Panel Box (Dark Charcoal #0A0A0E) -->
  <rect x="5" y="5" width="840" height="175" fill="url(#termGrad)" stroke="#22222e" stroke-width="1.5" />
  <rect x="5" y="5" width="840" height="175" fill="url(#termHalftoneDots)" />
  <rect x="5" y="140" width="840" height="40" fill="url(#termHatch)" />

  <!-- Hand-Inked Header Bar -->
  <rect x="5" y="5" width="840" height="30" fill="#111118" stroke="#262636" stroke-width="1" />

  <!-- Comic Panel Corner Brackets & Crimson Ink Ticks -->
  <path d="M 5 22 L 5 5 L 22 5" fill="none" stroke="#E50914" stroke-width="1.8" />
  <path d="M 845 168 L 845 180 L 828 180" fill="none" stroke="#E50914" stroke-width="1.8" />

  <!-- Terminal Window Controls (Graphic Novel Style) -->
  <circle cx="22" cy="20" r="4.5" fill="#E50914" />
  <circle cx="36" cy="20" r="4.5" fill="#2a2a38" />
  <circle cx="50" cy="20" r="4.5" fill="#1c1c26" />

  <!-- Terminal Title & Graphic Novel Caption Tag -->
  <text x="70" y="24" font-family="'Consolas', 'Fira Code', monospace" font-size="11" fill="#78788a" font-weight="bold" letter-spacing="1">
    [ LOG // TERMINAL_SESSION_071 ]
  </text>

  <!-- Live Telemetry Indicator on Right -->
  <g transform="translate(750, 20)">
    <circle cx="0" cy="0" r="3.5" fill="#FF3030" class="live-pip" filter="url(#cursorGlow)" />
    <text x="10" y="3.5" font-family="'Consolas', 'Fira Code', monospace" font-size="9.5" fill="#888899" letter-spacing="1.5">ACTIVE</text>
  </g>

  <!-- Corner Spider Web Anchor (Top Right) -->
  <g stroke="#383848" stroke-width="0.8" fill="none" opacity="0.4">
    <path d="M 845 5 L 775 5" />
    <path d="M 845 5 L 795 35" />
    <path d="M 845 5 L 815 48" />
    <path d="M 800 5 Q 815 22 845 26" stroke="#E50914" stroke-opacity="0.4" />
  </g>

  <!-- Terminal Content (Hand-Inked Typewriter Output) -->
  <g font-family="'Consolas', 'Fira Code', 'Courier New', monospace" font-size="13" letter-spacing="0.5">
    
    <!-- Command 1: $ whoami -->
    <g class="t-l1">
      <text x="30" y="60" fill="#E50914" font-weight="bold">$ </text>
      <text x="48" y="60" fill="#E0E0EA">whoami</text>
    </g>
    <!-- Output 1: animesh -->
    <g class="t-l2">
      <text x="48" y="80" fill="#8A8A9A">animesh</text>
      <text x="120" y="80" font-size="11" fill="#525264">[builder // systems researcher]</text>
    </g>

    <!-- Command 2: $ status -->
    <g class="t-l3">
      <text x="30" y="105" fill="#E50914" font-weight="bold">$ </text>
      <text x="48" y="105" fill="#E0E0EA">status</text>
    </g>
    <!-- Output 2: building... -->
    <g class="t-l4">
      <text x="48" y="125" fill="#8A8A9A">building</text>
      <text x="114" y="125" fill="#FF3030">...</text>
      <text x="145" y="125" font-size="11" fill="#525264">(systems, intelligence, protocols)</text>
    </g>

    <!-- Command 3: $ focus -->
    <g class="t-l5">
      <text x="30" y="150" fill="#E50914" font-weight="bold">$ </text>
      <text x="48" y="150" fill="#E0E0EA">focus</text>
    </g>
    <!-- Output 3: ai/ml · distributed systems · reactive interfaces -->
    <g class="t-l6">
      <text x="48" y="169" fill="#757585" font-size="12">
        <tspan fill="#B0B0C2">ai/ml</tspan>
        <tspan fill="#E50914" font-weight="bold"> · </tspan>
        <tspan fill="#B0B0C2">distributed systems</tspan>
        <tspan fill="#E50914" font-weight="bold"> · </tspan>
        <tspan fill="#B0B0C2">reactive interfaces</tspan>
      </text>
      <!-- Blinking Red Ink Cursor -->
      <rect x="428" y="158" width="7" height="13" class="comic-cursor" />
    </g>

  </g>
</svg>
