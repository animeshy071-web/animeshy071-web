<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 30" width="100%" height="30">
  <defs>
    <linearGradient id="handWebLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0" />
      <stop offset="15%" stop-color="#3a3a4c" stop-opacity="0.7" />
      <stop offset="45%" stop-color="#E50914" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FF3030" stop-opacity="1" />
      <stop offset="55%" stop-color="#E50914" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#3a3a4c" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </linearGradient>

    <filter id="crimsonNodeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes webDivPulse {
      0%, 100% { r: 3.2px; opacity: 0.75; }
      50% { r: 4.8px; opacity: 1; }
    }
    .div-node {
      animation: webDivPulse 3s infinite ease-in-out;
    }
  </style>

  <!-- Background Base -->
  <rect width="850" height="30" fill="#050505" />

  <!-- Hand-Drawn Primary Sagging Silk Strand -->
  <!-- Subtle dark blue shadow below line -->
  <path d="M 15 15 Q 220 18 425 15 T 835 15" stroke="#10182A" stroke-width="2.5" fill="none" opacity="0.8" />
  <!-- Main Inked Silk Thread -->
  <path d="M 15 15 Q 220 18 425 15 T 835 15" stroke="url(#handWebLine)" stroke-width="1.3" fill="none" />

  <!-- Organic Web Filaments & Tapering Anchor Tendrils -->
  <path d="M 260 15 Q 425 10 590 15" stroke="#E50914" stroke-width="0.7" opacity="0.4" fill="none" />
  <path d="M 370 15 L 395 6" stroke="#38384a" stroke-width="0.8" opacity="0.6" />
  <path d="M 480 15 L 455 24" stroke="#38384a" stroke-width="0.8" opacity="0.6" />
  <path d="M 180 15 L 165 22" stroke="#2c2c3a" stroke-width="0.7" opacity="0.5" />
  <path d="M 670 15 L 685 8" stroke="#2c2c3a" stroke-width="0.7" opacity="0.5" />

  <!-- Central Pulsing Crimson Web Knot / Node -->
  <circle cx="425" cy="15" r="3.8" fill="#FF3030" class="div-node" filter="url(#crimsonNodeGlow)" />
  <circle cx="425" cy="15" r="8.5" fill="none" stroke="#E50914" stroke-width="0.6" opacity="0.4" />

  <!-- Graphic Novel Reticle / Inked Crosshair Ticks -->
  <line x1="416" y1="15" x2="420" y2="15" stroke="#E50914" stroke-width="1" opacity="0.8" />
  <line x1="430" y1="15" x2="434" y2="15" stroke="#E50914" stroke-width="1" opacity="0.8" />
  <line x1="425" y1="6" x2="425" y2="10" stroke="#E50914" stroke-width="1" opacity="0.8" />
  <line x1="425" y1="20" x2="425" y2="24" stroke="#E50914" stroke-width="1" opacity="0.8" />
</svg>
